name: lab-smoke

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python lab tests
        run: python -m unittest discover -s tests -v
      - name: CLI syntax
        run: bash -n bin/research-lab
      - name: JSON config
        run: python -m json.tool config/harnesses.json >/dev/null
      - name: No-spend doctor invocation
        run: python scripts/research_lab.py doctor || true
