name: lab-smoke

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python lab and fake MCP tests
        run: python -m unittest discover -s tests -v
      - name: Python entrypoint syntax
        run: |
          python -m py_compile scripts/research_lab.py
          python -m py_compile scripts/setup_harnesses.py
          python -m py_compile scripts/adapter_entry.py
          python -m py_compile scripts/mcp_client.py
          python -m py_compile scripts/research_mcp.py
          python -m py_compile scripts/starintel_entry.py
      - name: CLI and adapter syntax
        run: |
          bash -n bin/research-lab
          bash -n bin/research-mcp
          bash -n adapters/starintel/bin/research
          test -x bin/research-lab
          test -x bin/research-mcp
          test -x adapters/starintel/bin/research
      - name: JSON config
        run: |
          python -m json.tool config/harnesses.json >/dev/null
          python -m json.tool mcp/servers.json >/dev/null
          python -m json.tool tests/fixtures/mcp-servers.fake.json >/dev/null
      - name: Credential-free wrapper dry run
        run: ./bin/research-lab matrix --case DR-001 --parallel 4 --model z-ai/glm-5.3-flash --dry-run
      - name: No-spend lab doctor invocation
        run: python scripts/research_lab.py doctor || true
