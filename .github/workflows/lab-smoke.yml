name: lab-smoke

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python lab and fake MCP tests
        run: python -m unittest discover -s tests -v
      - name: CLI and adapter syntax
        run: |
          bash -n bin/research-lab
          bash -n bin/research-mcp
          bash -n adapters/starintel/bin/research
          test -x bin/research-lab
          test -x bin/research-mcp
          test -x adapters/starintel/bin/research
      - name: JSON config
        run: |
          python -m json.tool config/harnesses.json >/dev/null
          python -m json.tool mcp/servers.json >/dev/null
          python -m json.tool tests/fixtures/mcp-servers.fake.json >/dev/null
      - name: No-spend lab doctor invocation
        run: python scripts/research_lab.py doctor || true
